# GnoSage agent — hourly scheduled reviews (Onyx testnet only).
name: gnosage-agent

on:
  schedule:
    - cron: "17 * * * *" # hourly, offset to avoid the :00 rush
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Gno toolchain
        run: |
          curl -fsSL https://raw.githubusercontent.com/gnolang/gno/master/misc/install.sh | sh
          echo "$HOME/.gno/bin" >> "$GITHUB_PATH"

      - name: Import agent key (throwaway testnet key)
        env:
          AGENT_MNEMONIC: ${{ secrets.AGENT_MNEMONIC }}
          GNOKEY_PASSWORD: ${{ secrets.GNOKEY_PASSWORD }}
        run: |
          printf '%s\n%s\n%s\n' "$AGENT_MNEMONIC" "$GNOKEY_PASSWORD" "$GNOKEY_PASSWORD" | gnokey add gnosage-agent --recover --quiet --insecure-password-stdin
          gnokey list

      - name: Install agent dependencies
        run: npm install

      - name: Build agent
        run: npm run build

      - name: Review queue
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GNOSAGE_REALM: ${{ secrets.GNOSAGE_REALM }}
          AGENT_KEY_NAME: gnosage-agent
          GNOKEY_PASSWORD: ${{ secrets.GNOKEY_PASSWORD }}
        run: npm run run
